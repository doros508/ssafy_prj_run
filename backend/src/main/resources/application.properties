spring.application.name=mrt_prj

# data source
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/run_prj?serverTimezone=UTC
spring.datasource.username=ssafy
spring.datasource.password=ssafy

#mybatis-config
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.mrt.mvc.*
mybatis.configuration.map-underscore-to-camel-case=true


# 정적 리소스 경로 설정
spring.web.resources.static-locations=classpath:/static/,file:///c:/uploads/

# 파일 업로드 설정
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB